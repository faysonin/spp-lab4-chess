<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Шахматы онлайн</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/pieces/wN.svg">
</head>
<body>
  <div id="lobby" class="screen">
    <div class="card">
      <h1>Шахматы</h1>
      <p class="lead">Два игрока за столом, остальные смотрят. Ходы сразу видны всем в комнате.</p>
      <p id="lobbyStatus" class="status wait">Подключение…</p>
      <form id="joinForm" autocomplete="off" novalidate>
        <label>Ник
          <input id="nickInput" type="text" maxlength="16" placeholder="Игрок" value="Игрок">
        </label>
        <label>Код комнаты
          <input id="roomInput" type="text" maxlength="8" placeholder="Пусто — создать новую" class="mono">
        </label>
        <fieldset>
          <legend>Место</legend>
          <label class="inline"><input type="radio" name="seat" value="" checked> любое</label>
          <label class="inline"><input type="radio" name="seat" value="w"> белые</label>
          <label class="inline"><input type="radio" name="seat" value="b"> чёрные</label>
        </fieldset>
        <button type="submit" class="btn">Войти</button>
      </form>
    </div>
  </div>

  <div id="game" class="screen hidden">
    <header class="bar">
      <div>
        <strong>Шахматы</strong>
        <span class="muted">комната <code id="roomCodeLabel">—</code>
          <button type="button" id="copyRoomBtn" class="link">копировать</button>
        </span>
      </div>
      <div class="bar-right">
        <span id="connStatus" class="status off">Нет сети</span>
        <span id="youLabel"></span>
        <button type="button" id="leaveBtn" class="btn quiet">Выйти</button>
      </div>
    </header>

    <div class="layout">
      <main>
        <p id="turnLine" class="turn-line">Ход белых</p>
        <div class="board-frame">
          <div id="ranks" class="ranks"></div>
          <div id="board" class="board" aria-label="Шахматная доска"></div>
          <div id="files" class="files"></div>
        </div>
        <p id="queueNote" class="queue hidden">Есть неотправленный ход — уйдёт после связи</p>
      </main>
      <aside>
        <section class="panel">
          <h2>Игроки</h2>
          <p id="seatWhite">Белые: —</p>
          <p id="seatBlack">Чёрные: —</p>
          <p id="specs" class="muted">Наблюдатели: нет</p>
          <button type="button" id="resignBtn" class="btn quiet">Сдаться</button>
        </section>
        <section class="panel">
          <h2>Ходы</h2>
          <ol id="moveList" class="moves"></ol>
        </section>
        <section class="panel">
          <h2>Журнал</h2>
          <ul id="logList" class="log"></ul>
        </section>
      </aside>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="/js/rules.js"></script>
  <script src="/js/net.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
